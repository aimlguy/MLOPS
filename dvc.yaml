stages:
  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - data/raw/noshow.csv
    outs:
      - data/processed/features.csv

  train_and_evaluate:
    cmd: python src/train.py --model-type baseline --auto-promote; python src/train.py --model-type improved --auto-promote; python src/train.py --model-type best --auto-promote; python src/evaluate.py
    deps:
      - src/train.py
      - src/evaluate.py
      - data/processed/features.csv
    outs:
      - reports/evaluation_report.md
      - reports/model_comparison.png
    metrics:
      - reports/metrics.json:
          cache: false
stages:
  data_validation:
    cmd: python src/feature_engineering.py
    deps:
      - data/raw/noshow.csv
      - src/feature_engineering.py
    outs:
      - data/processed/features.csv
    metrics:
      - metrics/data_stats.json:
          cache: false

  train_baseline:
    cmd: python src/train_baseline.py --auto-promote
    deps:
      - data/raw/noshow.csv
      - src/train_baseline.py
    metrics:
      - metrics/baseline_metrics.json:
          cache: false

  train_improved:
    cmd: python src/train_improved.py --auto-promote
    deps:
      - data/raw/noshow.csv
      - src/train_improved.py
    metrics:
      - metrics/improved_metrics.json:
          cache: false

  train_best:
    cmd: python src/train_best.py --auto-promote
    deps:
      - data/raw/noshow.csv
      - src/train_best.py
    metrics:
      - metrics/best_metrics.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
    outs:
      - reports/evaluation_report.html
    metrics:
      - metrics/final_comparison.json:
          cache: false
