version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: mlops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - mlops-monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: mlops-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/prometheus_datasource.json:/etc/grafana/provisioning/datasources/prometheus.json
      - ./monitoring/grafana_dashboard.json:/etc/grafana/provisioning/dashboards/noshow-dashboard.json
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - mlops-monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  mlops-monitoring:
    driver: bridge
